version: 2
default_compiler: ./vnew
available_tiers:
  - fast
  - targeted
  - broad
default_budget_seconds:
  fast: 120
  targeted: 600
  broad: 1800
runtime_band_seconds:
  tiny: 5
  short: 20
  medium: 90
  long: 300
  xlong: 1200
rules:
  - paths:
      - "v.mod"
      - "Dockerfile*"
      - ".gitattributes"
      - ".gitignore"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
    rebuild_vnew: false
    owner: repo-meta
    risk: low
    fast_tests:
      - { command: "./cmd/tools/agents/bootstrap_check.vsh", confidence: 0.90, runtime_sec: 1, runtime_band: tiny }
    targeted_tests:
      - { command: "./cmd/tools/agents/bootstrap_check.vsh", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
      - { command: "make -n agent-check VEXE=./vnew local=1", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
    broad_tests:
      - { command: "./cmd/tools/agents/bootstrap_check.vsh", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
      - { command: "make -n agent-check VEXE=./vnew local=1", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
  - paths:
      - "*.md"
    rebuild_vnew: false
    owner: docs
    risk: low
    fast_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.90, runtime_sec: 5, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.75, runtime_sec: 5, runtime_band: tiny }
    broad_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.60, runtime_sec: 5, runtime_band: tiny }
  - paths:
      - "GNUmakefile"
      - "Makefile"
    rebuild_vnew: false
    owner: build
    risk: medium
    fast_tests:
      - { command: "make -n agent-check VEXE=./vnew local=1", confidence: 0.90, runtime_sec: 1, runtime_band: tiny }
    targeted_tests:
      - { command: "make -n agent-check VEXE=./vnew local=1", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
    broad_tests:
      - { command: "make -n agent-check VEXE=./vnew local=1", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
  - paths:
      - "cmd/tools/agents/agent_test_matrix.yaml"
      - "cmd/tools/agents/**"
    rebuild_vnew: false
    owner: agent-infra
    risk: medium
    fast_tests:
      - { command: "./cmd/tools/agents/bootstrap_check.vsh", confidence: 0.90, runtime_sec: 1, runtime_band: tiny }
    targeted_tests:
      - { command: "./cmd/tools/agents/bootstrap_check.vsh", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
      - { command: "./cmd/tools/agents/suggest_tests.vsh cmd/tools/agents/agent_test_matrix.yaml", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
      - { command: "./vnew cmd/tools/agents/suggest_tests_test.v", confidence: 0.75, runtime_sec: 8, runtime_band: short }
    broad_tests:
      - { command: "./cmd/tools/agents/bootstrap_check.vsh", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
      - { command: "./cmd/tools/agents/suggest_tests.vsh cmd/tools/agents/agent_test_matrix.yaml", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
      - { command: "./vnew cmd/tools/agents/suggest_tests_test.v", confidence: 0.60, runtime_sec: 8, runtime_band: short }
      - { command: "./vnew cmd/tools/agents/validate_agent_contract_test.v", confidence: 0.60, runtime_sec: 2, runtime_band: tiny }
  - paths:
      - ".github/workflows/**"
    rebuild_vnew: false
    owner: ci-automation
    risk: medium
    fast_tests:
      - { command: "./cmd/tools/agents/validate_agent_contract.vsh", confidence: 0.90, runtime_sec: 1, runtime_band: tiny }
    targeted_tests:
      - { command: "./cmd/tools/agents/validate_agent_contract.vsh", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
    broad_tests:
      - { command: "./cmd/tools/agents/validate_agent_contract.vsh", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
      - { command: "./vnew cmd/tools/agents/validate_agent_contract_test.v", confidence: 0.60, runtime_sec: 2, runtime_band: tiny }
  - paths:
      - "ci/**"
    rebuild_vnew: false
    owner: ci
    risk: medium
    fast_tests:
      - { command: "./vnew check-md ci/", confidence: 0.90, runtime_sec: 1, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew check-md ci/", confidence: 0.75, runtime_sec: 1, runtime_band: tiny }
    broad_tests:
      - { command: "./vnew check-md ci/", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
      - { command: "./cmd/tools/agents/validate_agent_contract.vsh", confidence: 0.60, runtime_sec: 1, runtime_band: tiny }
  - paths:
      - "examples/**"
    rebuild_vnew: false
    owner: examples
    risk: medium
    fast_tests:
      - { command: "./vnew -silent build-examples", confidence: 0.90, runtime_sec: 65, runtime_band: medium }
    targeted_tests:
      - { command: "./vnew -silent build-examples", confidence: 0.75, runtime_sec: 65, runtime_band: medium }
    broad_tests:
      - { command: "./vnew -silent build-examples", confidence: 0.60, runtime_sec: 65, runtime_band: medium }
      - { command: "./vnew check-md examples/", confidence: 0.60, runtime_sec: 3, runtime_band: tiny }
  - paths:
      - "tutorials/**"
    rebuild_vnew: false
    owner: tutorials
    risk: low
    fast_tests:
      - { command: "./vnew check-md tutorials/", confidence: 0.90, runtime_sec: 4, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew check-md tutorials/", confidence: 0.75, runtime_sec: 4, runtime_band: tiny }
    broad_tests:
      - { command: "./vnew check-md tutorials/", confidence: 0.60, runtime_sec: 4, runtime_band: tiny }
  - paths:
      - "vlib/v/slow_tests/repl/**"
    rebuild_vnew: true
    owner: repl
    risk: medium
    fast_tests:
      - { command: "./vnew -silent vlib/v/slow_tests/repl/repl_test.v", confidence: 0.90, runtime_sec: 40, runtime_band: medium }
    targeted_tests:
      - { command: "./vnew -silent vlib/v/slow_tests/repl/repl_test.v", confidence: 0.75, runtime_sec: 40, runtime_band: medium }
    broad_tests:
      - { command: "./vnew -silent vlib/v/slow_tests/repl/repl_test.v", confidence: 0.60, runtime_sec: 40, runtime_band: medium }
  - paths:
      - "vlib/v/slow_tests/inout/**"
    rebuild_vnew: true
    owner: diagnostics
    risk: medium
    fast_tests:
      - { command: "./vnew -silent vlib/v/slow_tests/inout/compiler_test.v", confidence: 0.90, runtime_sec: 30, runtime_band: short }
    targeted_tests:
      - { command: "./vnew -silent vlib/v/slow_tests/inout/compiler_test.v", confidence: 0.75, runtime_sec: 30, runtime_band: short }
    broad_tests:
      - { command: "./vnew -silent vlib/v/slow_tests/inout/compiler_test.v", confidence: 0.60, runtime_sec: 30, runtime_band: short }
  - paths:

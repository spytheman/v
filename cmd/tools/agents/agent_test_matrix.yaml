    rebuild_vnew: false
    owner: vtimeout
    risk: medium
    fast_tests:
      - { command: "./vnew -silent cmd/tools/vtimeout_test.v", confidence: 0.90, runtime_sec: 3, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew -silent cmd/tools/vtimeout_test.v", confidence: 0.75, runtime_sec: 3, runtime_band: tiny }
    broad_tests:
      - { command: "./vnew -silent cmd/tools/vtimeout_test.v", confidence: 0.60, runtime_sec: 3, runtime_band: tiny }
      - { command: "./vnew -silent test cmd/tools/", confidence: 0.60, runtime_sec: 25, runtime_band: short }
  - paths:

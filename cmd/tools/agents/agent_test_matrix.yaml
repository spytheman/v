    targeted_tests:
      - { command: "./vnew -silent test vlib/v/checker/", confidence: 0.75, runtime_sec: 2, runtime_band: tiny }
      - { command: "./vnew -silent vlib/v/compiler_errors_test.v", confidence: 0.75, runtime_sec: 160, runtime_band: long }
    broad_tests:
      - { command: "./vnew -silent test vlib/v/", confidence: 0.60, runtime_sec: 800, runtime_band: xlong }
  - paths:
      - "vlib/v/fmt/**"
      - "cmd/tools/vfmt*"
      - "cmd/tools/vfmt/**"
    rebuild_vnew: true
    owner: fmt
    risk: medium
    fast_tests:
      - { command: "./vnew -silent vlib/v/fmt/fmt_test.v", confidence: 0.90, runtime_sec: 4, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew -silent vlib/v/fmt/fmt_test.v", confidence: 0.75, runtime_sec: 4, runtime_band: tiny }
      - { command: "./vnew -silent vlib/v/fmt/fmt_keep_test.v", confidence: 0.75, runtime_sec: 3, runtime_band: tiny }
    broad_tests:
      - { command: "./vnew -silent vlib/v/fmt/fmt_test.v", confidence: 0.60, runtime_sec: 4, runtime_band: tiny }
      - { command: "./vnew -silent vlib/v/fmt/fmt_keep_test.v", confidence: 0.60, runtime_sec: 3, runtime_band: tiny }
      - { command: "./vnew -silent vlib/v/fmt/fmt_vlib_test.v", confidence: 0.60, runtime_sec: 3, runtime_band: tiny }
  - paths:
      - "cmd/tools/vdoc/**"
    rebuild_vnew: false
    owner: vdoc
    risk: medium
    fast_tests:
      - { command: "./vnew -silent cmd/tools/vdoc/vdoc_test.v", confidence: 0.90, runtime_sec: 4, runtime_band: tiny }

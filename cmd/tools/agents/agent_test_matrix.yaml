    rebuild_vnew: true
    owner: core-builtin
    risk: high
    fast_tests:
      - { command: "./vnew -silent test vlib/builtin/", confidence: 0.90, runtime_sec: 9, runtime_band: short }
    targeted_tests:
      - { command: "./vnew -silent test vlib/builtin/", confidence: 0.75, runtime_sec: 9, runtime_band: short }
    broad_tests:
      - { command: "./vnew -silent test vlib/builtin/", confidence: 0.60, runtime_sec: 9, runtime_band: short }
  - paths:
      - "vlib/strings/**"
    rebuild_vnew: true
    owner: core-strings
    risk: high
    fast_tests:
      - { command: "./vnew -silent test vlib/strings/", confidence: 0.90, runtime_sec: 3, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew -silent test vlib/strings/", confidence: 0.75, runtime_sec: 3, runtime_band: tiny }
    broad_tests:
      - { command: "./vnew -silent test vlib/strings/", confidence: 0.60, runtime_sec: 3, runtime_band: tiny }
  - paths:
      - "vlib/os/**"
    rebuild_vnew: true
    owner: core-os
    risk: high
    fast_tests:
      - { command: "./vnew -silent test vlib/os/", confidence: 0.90, runtime_sec: 10, runtime_band: short }
    targeted_tests:
      - { command: "./vnew -silent test vlib/os/", confidence: 0.75, runtime_sec: 10, runtime_band: short }
    broad_tests:

  - paths:
      - "vlib/v/gen/native/**"
    rebuild_vnew: true
    owner: native-backend
    risk: high
    fast_tests:
      - { command: "./vnew test vlib/v/gen/native/", confidence: 0.90, runtime_sec: 15, runtime_band: short }
    targeted_tests:

helper_target:
  command: "make agent-check VEXE=./vnew"
  description: "Deterministic baseline validation for agent changes."
suggest_command:
  command: "./cmd/tools/agents/suggest_tests.vsh"
  description: "Suggest tiered test commands from changed files."

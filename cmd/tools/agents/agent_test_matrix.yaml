    broad_tests:
      - { command: "./vnew -silent cmd/tools/vdoc/vdoc_test.v", confidence: 0.60, runtime_sec: 4, runtime_band: tiny }
      - { command: "./vnew -silent cmd/tools/vdoc/vdoc_file_test.v", confidence: 0.60, runtime_sec: 2, runtime_band: tiny }
      - { command: "./vnew -silent cmd/tools/vdoc/vdoc_run_examples_test.v", confidence: 0.60, runtime_sec: 3, runtime_band: tiny }
  - paths:
      - "vlib/v/gen/js/**"
    rebuild_vnew: true
    owner: js-backend
    risk: high
    fast_tests:
      - { command: "./vnew test vlib/v/gen/js/", confidence: 0.90, runtime_sec: 5, runtime_band: tiny }
    targeted_tests:
      - { command: "./vnew test vlib/v/gen/js/", confidence: 0.75, runtime_sec: 5, runtime_band: tiny }
    broad_tests:

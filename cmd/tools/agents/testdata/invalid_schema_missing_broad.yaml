version: 2
default_compiler: ./vnew
available_tiers:
  - fast
  - targeted
  - broad
default_budget_seconds:
  fast: 120
  targeted: 600
  broad: 1800
runtime_band_seconds:
  tiny: 5
  short: 20
  medium: 90
  long: 300
  xlong: 1200
rules:
  - paths:
      - "*.md"
    rebuild_vnew: false
    owner: docs
    risk: low
    fast_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.90, runtime_sec: 20, runtime_band: short }
    targeted_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.75, runtime_sec: 90, runtime_band: medium }
helper_target:
  command: "make agent-check VEXE=./vnew"
  description: "x"
suggest_command:
  command: "./cmd/tools/agents/suggest_tests.vsh"
  description: "x"

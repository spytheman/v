name: Agent Contract CI

on:
  pull_request:
    paths:
      - ".github/workflows/agent_contract_ci.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "TESTS.md"
      - "AGENTS.md"
      - "LLMS.md"
      - "doc/agent_workflow.md"
      - "doc/agent_bugfix_playbook.md"
      - "GNUmakefile"
      - "cmd/tools/agents/agent_test_matrix.yaml"
      - "cmd/tools/agents/agent_policy_min.yaml"
      - "cmd/tools/agents/**"
  push:
    paths:
      - ".github/workflows/agent_contract_ci.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "TESTS.md"
      - "AGENTS.md"
      - "LLMS.md"
      - "doc/agent_workflow.md"
      - "doc/agent_bugfix_playbook.md"
      - "GNUmakefile"
      - "cmd/tools/agents/agent_test_matrix.yaml"
      - "cmd/tools/agents/agent_policy_min.yaml"
      - "cmd/tools/agents/**"
  workflow_dispatch:

jobs:
  agent-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V bootstrap compiler
        run: make

      - name: Build vnew
        run: ./v -g -keepc -o ./vnew cmd/v

      - name: Validate agent contract
        run: ./cmd/tools/agents/validate_agent_contract.vsh

      - name: Validate agent docs sync
        run: ./cmd/tools/agents/sync_agent_docs.vsh --check

      - name: Run agent script tests
        run: |
          ./vnew cmd/tools/agents/suggest_tests_test.v
          ./vnew cmd/tools/agents/validate_agent_contract_test.v
          ./vnew cmd/tools/agents/validate_agent_run_summary_test.v
          ./vnew cmd/tools/agents/print_agent_run_summary_test.v
          ./vnew cmd/tools/agents/doctor_test.v
          ./vnew cmd/tools/agents/sync_agent_docs_test.v

      - name: Check agent runtime artifacts
        run: make agent-artifact-clean-check

      - name: Agent smoke parity target
        run: make agent-smoke VEXE=./vnew local=1

  agent-suggest-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build V bootstrap compiler
        run: make

      - name: Build vnew
        run: ./v -g -keepc -o ./vnew cmd/v

      - name: Agent suggest smoke (changed-from, all formats)
        run: |
          BASE_REF="$(git rev-parse --verify HEAD~1 || git rev-parse HEAD)"
          ./cmd/tools/agents/suggest_tests.vsh --changed-from "$BASE_REF" --tier targeted --strict-unmatched --require-non-fallback
          ./cmd/tools/agents/suggest_tests.vsh --changed-from "$BASE_REF" --tier targeted --json --require-non-fallback
          ./cmd/tools/agents/suggest_tests.vsh --changed-from "$BASE_REF" --tier targeted --format sh --require-non-fallback
          AGENT_ARTIFACT="$(mktemp "/tmp/agent_ci_run_summary.${GITHUB_RUN_ID:-local}.${GITHUB_RUN_ATTEMPT:-0}.XXXXXX.json")"
          ./cmd/tools/agents/suggest_tests.vsh --tier targeted --json --require-non-fallback README.md > "$AGENT_ARTIFACT"
          ./cmd/tools/agents/validate_agent_run_summary.vsh "$AGENT_ARTIFACT"
          rm -f "$AGENT_ARTIFACT"

      - name: Agent suggest fallback sanity
        run: |
          if ! ./cmd/tools/agents/suggest_tests.vsh --strict-unmatched definitely_unmatched.file | grep -q "owner=fallback"; then
            echo "expected fallback owner to be selected"
            exit 1
          fi

      - name: Check agent runtime artifacts
        run: make agent-artifact-clean-check

      - name: Agent smoke parity target
        run: make agent-smoke VEXE=./vnew local=1

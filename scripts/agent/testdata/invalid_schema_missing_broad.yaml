version: 2
default_compiler: ./vnew
available_tiers:
  - fast
  - targeted
  - broad
rules:
  - paths:
      - "*.md"
    rebuild_vnew: false
    owner: docs
    risk: low
    fast_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.90, runtime_sec: 20 }
    targeted_tests:
      - { command: "./vnew check-md <touched-md-file>", confidence: 0.75, runtime_sec: 90 }
helper_target:
  command: "make agent-check VEXE=./vnew"
  description: "x"
suggest_command:
  command: "./scripts/agent/suggest_tests.vsh"
  description: "x"

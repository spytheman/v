version: 2
default_compiler: ./vnew
available_tiers:
  - fast
  - targeted
  - broad
rules:
  - paths:
      - "scripts/agent/**"
    rebuild_vnew: false
    owner: agent-infra
    risk: medium
    fast_tests:
      - { command: "./scripts/agent/does_not_exist.vsh", confidence: 0.90, runtime_sec: 20 }
    targeted_tests:
      - { command: "./scripts/agent/does_not_exist.vsh", confidence: 0.75, runtime_sec: 90 }
    broad_tests:
      - { command: "./scripts/agent/does_not_exist.vsh", confidence: 0.60, runtime_sec: 240 }
helper_target:
  command: "make agent-check VEXE=./vnew"
  description: "x"
suggest_command:
  command: "./scripts/agent/suggest_tests.vsh"
  description: "x"

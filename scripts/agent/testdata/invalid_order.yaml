version: 2
default_compiler: ./vnew
available_tiers:
  - fast
  - targeted
  - broad
rules:
  - paths:
      - "vlib/v/**"
    rebuild_vnew: true
    owner: compiler
    risk: high
    fast_tests:
      - { command: "./vnew -silent vlib/v/compiler_errors_test.v", confidence: 0.90, runtime_sec: 20 }
    targeted_tests:
      - { command: "./vnew -silent vlib/v/compiler_errors_test.v", confidence: 0.75, runtime_sec: 90 }
    broad_tests:
      - { command: "./vnew -silent vlib/v/compiler_errors_test.v", confidence: 0.60, runtime_sec: 240 }
  - paths:
      - "vlib/v/parser/**"
    rebuild_vnew: true
    owner: parser
    risk: high
    fast_tests:
      - { command: "./vnew -silent test vlib/v/parser/", confidence: 0.90, runtime_sec: 20 }
    targeted_tests:
      - { command: "./vnew -silent test vlib/v/parser/", confidence: 0.75, runtime_sec: 90 }
    broad_tests:
      - { command: "./vnew -silent test vlib/v/parser/", confidence: 0.60, runtime_sec: 240 }
helper_target:
  command: "make agent-check VEXE=./vnew"
  description: "x"
suggest_command:
  command: "./scripts/agent/suggest_tests.vsh"
  description: "x"
